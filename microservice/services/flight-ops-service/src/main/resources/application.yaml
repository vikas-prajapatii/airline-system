server:
  port: 5003

spring:
  application:
    name: flight-ops-service

  datasource:
    url: jdbc:postgresql://localhost:5432/airline_flight_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
