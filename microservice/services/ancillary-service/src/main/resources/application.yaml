server:
  port: 5007

spring:
  application:
    name: ancillary-service

  datasource:
    url: jdbc:postgresql://localhost:5432/airline_ancillary_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

airline-service:
  url: http://localhost:5002
