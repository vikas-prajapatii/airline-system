server:
  port: 5002

spring:
  application:
    name: airline-core-service

  datasource:
    url: jdbc:postgresql://localhost:5432/airline_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
